# Deja una versión EN ESPERA en npm, SOLO desde acá, al crear un tag vX.Y.Z que coincida con
# package.json. Usa "trusted publishing" (OIDC): no hay token de npm guardado que se pueda robar.
# La versión no sale al público hasta que quien mantiene el paquete la aprueba en npmjs.com con
# su 2FA ("staged publishing"): ni un repo comprometido alcanza para publicar. Antes corre la
# misma revisión que el CI. Quien quiera verificar lo instalado: `npm audit signatures`.
name: publicar
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  id-token: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@12
      # SheetJS (lector de .xls viejos) solo publica sus versiones seguras en su propio CDN, no en npm;
      # npm 12 bloquea esos tarballs por defecto. Está fijado por URL exacta e integridad en el lockfile.
      - run: npm ci --ignore-scripts
        env:
          NPM_CONFIG_ALLOW_REMOTE: all
      - run: npm run build
      - run: REVISAR_TODO=1 npm run revisar
      - name: El tag tiene que ser la versión de package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} ≠ package.json $v"; exit 1; }
          grep -q "version: '$v'" src/index.ts || { echo "src/index.ts no dice la versión $v"; exit 1; }
      # npm 12 (el que trae la publicación en staging) ignora npm-shrinkwrap.json, así que el lockfile
      # no puede viajar dentro del paquete: las dependencias directas van con versión exacta en
      # package.json y acá se verifica que el paquete no lleve nada de más.
      - name: El paquete lleva solo dist, README, LICENSE, SECURITY y package.json
        run: |
          npm pack --dry-run --json | node -e '
            const j = JSON.parse(require("fs").readFileSync(0, "utf8")); const p = Array.isArray(j) ? j[0] : Object.values(j)[0]; // npm 11 imprime una lista; npm 12, un objeto por paquete
            const files = p.files.map((f) => f.path);
            if (files.some((f) => !/^(dist\/|README\.md$|LICENSE$|SECURITY\.md$|package\.json$)/.test(f))) { console.error("archivo inesperado en el paquete:", files); process.exit(1); }
            console.log(files.length, "archivos");
          '
      - run: npm stage publish . --provenance --access public
