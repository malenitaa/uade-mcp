# La misma revisión que corre el hook pre-commit, pero en GitHub, en cada push y cada PR:
# tipos, tests (con la auditoría), npm audit y búsqueda de secretos en todo el árbol.
# Sin credenciales de nadie: no toca UADE ni cuentas; solo el código.
name: revisar
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  revisar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # SheetJS (lector de .xls viejos) solo publica sus versiones seguras en su propio CDN, no en npm;
      # npm 12 bloquea esos tarballs por defecto. Está fijado por URL exacta e integridad en el lockfile.
      - run: npm ci --ignore-scripts
        env:
          NPM_CONFIG_ALLOW_REMOTE: all
      - run: npm run build
      - run: REVISAR_TODO=1 npm run revisar
